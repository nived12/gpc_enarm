    doctor:
      eyebrow: "Quién está detrás"
      title_lines: ["Creado por la", "Dra.", "Guadarrama"]
      story:
        - "Probé los simuladores que hay para el ENARM y a todos les faltaba algo. Unos cuestan demasiado. Otros son difíciles de usar, o no están al día. Y casi ninguno te enseña de qué parte de la GPC sale la respuesta."
        - "Hice GPCEnarm para tener las cuatro cosas en un solo lugar: lo que yo buscaba y no encontré."
        - "Lo construí con mi esposo, que es ingeniero de software: yo me encargo de la medicina y él de que todo funcione bien en la plataforma."
      photo_alt: "La Dra. Guadarrama"
      reasons:
        price:
          title: "Accesible"
          body: "Desde ≈ %{amount} al día, en un solo pago que no se renueva."
        easy:
          title: "Fácil de usar"
          body: "Abres, contestas y aprendes, en la computadora o en el celular, sin instalar nada."
        current:
          title: "Actualizado"
          body: "Usa la edición más reciente de cada GPC y te dice su año."
        cited:
          title: "Con la GPC de verdad"
          body: "Cada respuesta trae la frase exacta de la guía, su grado y dónde encontrarla."
    faq:
      title: "Preguntas frecuentes"
      items:
        trial:
          question: "¿Cómo funciona la prueba gratis?"
          answer: "Creas tu cuenta con tu correo y tienes %{trial_days} días sin límite. No te pedimos tarjeta. Al terminar, sigues con %{limit} preguntas gratis cada día o eliges un periodo de acceso."
        renewal:
          question: "¿Me van a cobrar cada mes?"
          answer: "No. Pagas una sola vez por el periodo que elijas y termina en su fecha. No guardamos tu tarjeta y no hay nada que cancelar."
        oxxo:
          question: "¿Puedo pagar en OXXO?"
          answer: "Sí. Al pagar eliges OXXO y recibes una ficha con código de barras, también por correo, para pagar en efectivo en cualquier OXXO dentro de %{oxxo_days} días. Tu acceso se activa cuando el pago se acredita, normalmente al siguiente día hábil. También aceptamos tarjeta de crédito o débito y Apple Pay."
        different:
          question: "¿Qué lo hace diferente?"
          answer: "En cada pregunta ves la frase exacta de la GPC de donde sale la respuesta, con su grado de evidencia y el año de la guía, así que estudias la guía mientras practicas. Además te arma un plan de estudio hasta tu examen, y cuesta desde ≈ %{amount} al día."
        currency:
          question: "¿Las GPC están actualizadas?"
          answer: "Usamos la edición más reciente de cada guía, y cada cita trae su año. Algunas guías que siguen en el temario ya pasaron su vigencia; esas te las marcamos, para que sepas qué estás estudiando."
        mock:
          question: "¿El simulacro es como el examen real?"
          answer: "Sí: %{mock_questions} preguntas en casos clínicos, con el mismo tiempo por pregunta que el examen y las explicaciones al final."
        phone:
          question: "¿Lo puedo usar en la computadora y en el celular?"
          answer: "Sí, en los dos, desde el navegador y sin instalar nada. Tu avance es el mismo en ambos, y tiene modo oscuro para estudiar de noche."
    closing:
      title: "Empieza hoy. Los primeros %{trial_days} días no tienen límite."
      share: "Mándalo a tu grupo"
      share_text: "Simulador ENARM que te enseña la frase exacta de la GPC en cada respuesta: %{url}"

